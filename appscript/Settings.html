<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    font-size: 13px;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 16px;
    color: white;
    position: sticky; top: 0; z-index: 10;
  }
  .header .brand { color: #5c7cff; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
  .header h1 { font-size: 17px; font-weight: 700; }
  .body { padding: 14px; }

  .section {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .section h3 {
    font-size: 11px; font-weight: 700; color: #5c7cff;
    text-transform: uppercase; letter-spacing: .8px;
    margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px;
  }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 4px; }
  .hint { font-size: 10px; color: #aaa; margin-top: 3px; }

  input[type=text], input[type=email], input[type=number], select {
    width: 100%; padding: 8px 10px;
    border: 1.5px solid #e0e0e0; border-radius: 7px;
    font-size: 13px; color: #1a1a2e; background: white;
    transition: border .2s;
    outline: none;
  }
  input:focus, select:focus { border-color: #5c7cff; }

  .toggle-row { display: flex; justify-content: space-between; align-items: center; }
  .toggle {
    position: relative; width: 40px; height: 22px;
    flex-shrink: 0; margin-left: 8px;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute; inset: 0; background: #ddd; border-radius: 22px; cursor: pointer;
    transition: background .2s;
  }
  .toggle .slider::before {
    content: ''; position: absolute; height: 16px; width: 16px;
    left: 3px; top: 3px; background: white; border-radius: 50%;
    transition: transform .2s;
  }
  .toggle input:checked + .slider { background: #5c7cff; }
  .toggle input:checked + .slider::before { transform: translateX(18px); }

  .btn {
    display: block; width: 100%; padding: 10px;
    border: none; border-radius: 8px; font-size: 13px;
    font-weight: 700; cursor: pointer; margin-bottom: 8px;
    text-align: center; transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #5c7cff; color: white; }
  .btn-green   { background: #22d47e; color: white; }
  .btn-orange  { background: #ff9f43; color: white; }
  .btn-red     { background: #ff5b6b; color: white; }
  .btn-gray    { background: #eee; color: #555; }

  .method-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    flex: 1; padding: 7px; border: 1.5px solid #e0e0e0;
    border-radius: 8px; text-align: center; cursor: pointer;
    font-size: 11px; font-weight: 600; color: #888; background: white;
    transition: all .2s;
  }
  .tab.active { border-color: #5c7cff; color: #5c7cff; background: #f0f4ff; }

  .panel { display: none; }
  .panel.active { display: block; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .carrier-badge {
    padding: 5px 10px; border: 1.5px solid #e0e0e0; border-radius: 20px;
    font-size: 11px; font-weight: 600; cursor: pointer; color: #666;
    transition: all .15s;
  }
  .carrier-badge.selected { border-color: #5c7cff; color: #5c7cff; background: #f0f4ff; }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: white; padding: 8px 18px; border-radius: 20px;
    font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0;
    transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 999;
  }
  .toast.show { opacity: 1; }

  .spinner { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>
<div class="header">
  <div class="brand">FINFLOW</div>
  <h1>⚙️ Settings</h1>
</div>

<div class="body" id="content">
  <div class="spinner">Loading settings…</div>
</div>

<div class="toast" id="toast"></div>

<script>
var carriers = [
  { id: 'att',       label: 'AT&T' },
  { id: 'tmobile',   label: 'T-Mobile' },
  { id: 'verizon',   label: 'Verizon' },
  { id: 'sprint',    label: 'Sprint' },
  { id: 'boost',     label: 'Boost' },
  { id: 'cricket',   label: 'Cricket' },
  { id: 'googlefi',  label: 'Google Fi' },
  { id: 'metro',     label: 'Metro PCS' },
];

function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, ms || 2500);
}

function g(id) { return document.getElementById(id); }
function val(id) { return g(id) ? g(id).value : ''; }
function chk(id) { return g(id) ? g(id).checked : false; }

function renderSettings(s) {
  // Phone method tab state
  var method = s.phoneNotificationMethod || 'sms';

  var carrierBadges = carriers.map(function(c) {
    var sel = (s.phoneCarrier || 'att') === c.id ? ' selected' : '';
    return '<span class="carrier-badge' + sel + '" onclick="selectCarrier(\'' + c.id + '\')">' + c.label + '</span>';
  }).join('');

  var html =
    // ── Email Settings ──
    '<div class="section">' +
    '<h3>📧 Email Notifications</h3>' +
    '<div class="field">' +
    '<div class="toggle-row"><label>Enable email reminders</label>' +
    _toggle('enableEmailNotifications', s.enableEmailNotifications !== 'false') + '</div>' +
    '</div>' +
    '<div class="field">' +
    '<label>Your email address</label>' +
    '<input type="email" id="email" value="' + (s.email||'') + '" placeholder="you@gmail.com">' +
    '<div class="hint">Where all reminders & reports will be sent</div>' +
    '</div>' +
    '</div>' +

    // ── Phone Notifications ──
    '<div class="section">' +
    '<h3>📱 Phone / Push Notifications</h3>' +
    '<div class="field">' +
    '<div class="toggle-row"><label>Enable phone notifications</label>' +
    _toggle('enablePhoneNotifications', s.enablePhoneNotifications === 'true') + '</div>' +
    '</div>' +
    '<div class="field">' +
    '<label>Notification method</label>' +
    '<div class="method-tabs">' +
    '<div class="tab' + (method==='sms'?      ' active':'') + '" onclick="switchMethod(\'sms\')">📱 SMS</div>' +
    '<div class="tab' + (method==='pushover'?' active':'') + '" onclick="switchMethod(\'pushover\')">🔔 Pushover</div>' +
    '<div class="tab' + (method==='webhook'? ' active':'') + '" onclick="switchMethod(\'webhook\')">🔗 Webhook</div>' +
    '</div>' +

    // SMS panel
    '<div id="panel-sms" class="panel' + (method==='sms'?' active':'') + '">' +
    '<div class="field"><label>Option A – Direct phone email</label>' +
    '<input type="text" id="phoneEmail" value="' + (s.phoneEmail||'') + '" placeholder="6505551234@txt.att.net">' +
    '<div class="hint">Fill this OR use option B below. Leave blank to auto-build from number + carrier.</div>' +
    '</div>' +
    '<div class="field"><label>Option B – Phone number</label>' +
    '<input type="text" id="phoneNumber" value="' + (s.phoneNumber||'') + '" placeholder="6505551234 (digits only)">' +
    '</div>' +
    '<div class="field"><label>Carrier</label>' +
    '<div class="badge-row" id="carrier-badges">' + carrierBadges + '</div>' +
    '<input type="hidden" id="phoneCarrier" value="' + (s.phoneCarrier||'att') + '">' +
    '</div>' +
    '</div>' +

    // Pushover panel
    '<div id="panel-pushover" class="panel' + (method==='pushover'?' active':'') + '">' +
    '<div class="field"><label>Pushover App Token</label>' +
    '<input type="text" id="pushoverToken" value="' + (s.pushoverToken||'') + '" placeholder="axxxxx...">' +
    '<div class="hint">Create a free app at pushover.net</div></div>' +
    '<div class="field"><label>Pushover User Key</label>' +
    '<input type="text" id="pushoverUser" value="' + (s.pushoverUser||'') + '" placeholder="uxxxxx...">' +
    '</div></div>' +

    // Webhook panel
    '<div id="panel-webhook" class="panel' + (method==='webhook'?' active':'') + '">' +
    '<div class="field"><label>Webhook URL</label>' +
    '<input type="text" id="webhookUrl" value="' + (s.webhookUrl||'') + '" placeholder="https://maker.ifttt.com/trigger/...">' +
    '<div class="hint">IFTTT, Zapier, Make, or any POST endpoint. Sends JSON with value1/value2/value3.</div></div>' +
    '</div>' +

    '<input type="hidden" id="phoneNotificationMethod" value="' + method + '">' +
    '</div>' + // close method field
    '</div>' + // close section

    // ── Reminder Schedule ──
    '<div class="section">' +
    '<h3>⏰ Reminder Schedule</h3>' +
    '<div class="field"><label>Remind me X days before due date</label>' +
    '<input type="text" id="reminderDays" value="' + (s.reminderDays||'7,3,1') + '" placeholder="7,3,1">' +
    '<div class="hint">Comma-separated. E.g. "7,3,1" sends reminders 7, 3, and 1 day(s) before due.</div>' +
    '</div>' +
    '<div class="field"><div class="toggle-row"><label>Alert when bill is due today</label>' +
    _toggle('sendDueTodayAlert', s.sendDueTodayAlert !== 'false') + '</div></div>' +
    '<div class="field"><div class="toggle-row"><label>Alert for overdue bills</label>' +
    _toggle('overdueAlertEnabled', s.overdueAlertEnabled !== 'false') + '</div></div>' +
    '<div class="field"><label>Grace period before "overdue" flag (days)</label>' +
    '<input type="number" id="overdueGraceDays" value="' + (s.overdueGraceDays||'3') + '" min="0" max="14">' +
    '<div class="hint">Bills are not flagged overdue until this many days after their due day.</div>' +
    '</div>' +
    '</div>' +

    // ── Reports & Digests ──
    '<div class="section">' +
    '<h3>📊 Reports & Digests</h3>' +
    '<div class="field"><div class="toggle-row"><label>Weekly financial digest (Mondays)</label>' +
    _toggle('weeklyDigestEnabled', s.weeklyDigestEnabled !== 'false') + '</div></div>' +
    '<div class="field"><div class="toggle-row"><label>Monthly financial report</label>' +
    _toggle('monthlyReportEnabled', s.monthlyReportEnabled !== 'false') + '</div></div>' +
    '<div class="field"><label>Monthly report send day</label>' +
    '<input type="number" id="monthlyReportDay" value="' + (s.monthlyReportDay||'1') + '" min="1" max="28">' +
    '</div>' +
    '</div>' +

    // ── Payoff & Forecast ──
    '<div class="section">' +
    '<h3>🎯 Payoff & Forecast</h3>' +
    '<div class="field"><label>Extra monthly debt payment ($)</label>' +
    '<input type="number" id="extraPayment" value="' + (s.extraPayment||'0') + '" min="0" step="10">' +
    '<div class="hint">Applied on top of minimum payments using your chosen strategy.</div>' +
    '</div>' +
    '<div class="field"><label>Payoff strategy</label>' +
    '<select id="payoffStrategy">' +
    '<option value="avalanche"' + (s.payoffStrategy==='avalanche'?' selected':'') + '>Avalanche – Highest APR first (saves most interest)</option>' +
    '<option value="snowball"'  + (s.payoffStrategy==='snowball' ?' selected':'') + '>Snowball – Lowest balance first (psychological wins)</option>' +
    '</select></div>' +
    '<div class="field"><label>Default forecast horizon</label>' +
    '<select id="forecastMonths">' +
    '<option value="12"'  + (s.forecastMonths==='12' ||!s.forecastMonths ?' selected':'') + '>12 months</option>' +
    '<option value="24"'  + (s.forecastMonths==='24'?' selected':'') + '>24 months</option>' +
    '<option value="36"'  + (s.forecastMonths==='36'?' selected':'') + '>36 months</option>' +
    '</select></div>' +
    '</div>' +

    // ── Budget Alerts ──
    '<div class="section">' +
    '<h3>⚠️ Budget Alerts</h3>' +
    '<div class="field"><label>Alert threshold (% of income)</label>' +
    '<input type="number" id="budgetAlertThreshold" value="' + (s.budgetAlertThreshold||'90') + '" min="50" max="100">' +
    '<div class="hint">Send alert when total obligations exceed this % of monthly income.</div>' +
    '</div>' +
    '</div>' +

    // ── Actions ──
    '<div class="section">' +
    '<h3>💾 Actions</h3>' +
    '<button class="btn btn-primary" onclick="saveAll()">💾 Save All Settings</button>' +
    '<button class="btn btn-green"   onclick="testNotif()">🧪 Send Test Notification</button>' +
    '<button class="btn btn-orange"  onclick="setupTriggers()">⏰ Setup Automated Triggers</button>' +
    '<button class="btn btn-red"     onclick="removeTriggers()">🗑️ Remove All Triggers</button>' +
    '</div>';

  document.getElementById('content').innerHTML = html;
}

function _toggle(id, checked) {
  return '<label class="toggle"><input type="checkbox" id="' + id + '"' + (checked?' checked':'') + '>' +
    '<span class="slider"></span></label>';
}

function switchMethod(m) {
  document.getElementById('phoneNotificationMethod').value = m;
  document.querySelectorAll('.method-tabs .tab').forEach(function(t,i){
    t.classList.toggle('active', ['sms','pushover','webhook'][i] === m);
  });
  ['sms','pushover','webhook'].forEach(function(p){
    var el = document.getElementById('panel-' + p);
    if (el) el.classList.toggle('active', p === m);
  });
}

function selectCarrier(id) {
  document.getElementById('phoneCarrier').value = id;
  document.querySelectorAll('.carrier-badge').forEach(function(b){
    b.classList.toggle('selected', b.textContent.toLowerCase().replace(/[^a-z]/g,'') === id ||
      carriers.find(function(c){return c.id===id;}).label === b.textContent);
  });
}

function collectSettings() {
  var obj = {};
  var fields = ['email','phoneEmail','phoneNumber','phoneCarrier','phoneNotificationMethod',
    'pushoverToken','pushoverUser','webhookUrl','reminderDays','overdueGraceDays',
    'monthlyReportDay','extraPayment','payoffStrategy','forecastMonths','budgetAlertThreshold'];
  var toggles = ['enableEmailNotifications','enablePhoneNotifications',
    'sendDueTodayAlert','overdueAlertEnabled','weeklyDigestEnabled','monthlyReportEnabled'];

  fields.forEach(function(id) { if (g(id)) obj[id] = val(id); });
  toggles.forEach(function(id) { if (g(id)) obj[id] = chk(id) ? 'true' : 'false'; });
  return obj;
}

function saveAll() {
  toast('Saving…');
  google.script.run
    .withSuccessHandler(function(){ toast('✅ Settings saved!'); })
    .withFailureHandler(function(e){ toast('❌ ' + e.message); })
    .saveAllSettingsFromUI(collectSettings());
}

function testNotif() {
  saveAll();
  setTimeout(function(){
    toast('Sending test…');
    google.script.run
      .withSuccessHandler(function(r){ toast(r.message || '✅ Sent!', 4000); })
      .withFailureHandler(function(e){ toast('❌ ' + e.message); })
      .testNotification();
  }, 600);
}

function setupTriggers() {
  toast('Setting up triggers…');
  google.script.run
    .withSuccessHandler(function(){ toast('✅ Triggers activated!'); })
    .setupTriggers();
}

function removeTriggers() {
  toast('Removing triggers…');
  google.script.run
    .withSuccessHandler(function(){ toast('✅ Triggers removed!'); })
    .removeTriggers();
}

// Load settings
google.script.run
  .withSuccessHandler(function(s){ renderSettings(s); })
  .withFailureHandler(function(e){
    document.getElementById('content').innerHTML =
      '<div style="padding:20px;color:#ff5b6b;">❌ Error: ' + e.message + '</div>';
  })
  .getAllSettings();
</script>
</body>
</html>
