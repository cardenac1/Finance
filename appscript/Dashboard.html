<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    font-size: 13px;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 16px 16px 14px;
    color: white;
  }
  .header .brand { color: #5c7cff; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
  .header h1 { font-size: 17px; font-weight: 700; }
  .body { padding: 14px; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi {
    background: white;
    border-radius: 10px;
    padding: 12px 14px;
    border-left: 3px solid #5c7cff;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .kpi .label { font-size: 10px; color: #888; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 18px; font-weight: 700; }
  .green  { color: #22d47e; border-color: #22d47e !important; }
  .red    { color: #ff5b6b; border-color: #ff5b6b !important; }
  .orange { color: #ff9f43; border-color: #ff9f43 !important; }
  .blue   { color: #5c7cff; border-color: #5c7cff !important; }
  .purple { color: #a78bfa; border-color: #a78bfa !important; }

  .section { background: white; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .section h3 { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }

  .bill-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .bill-row:last-child { border-bottom: none; }
  .bill-name { font-weight: 600; font-size: 13px; }
  .bill-due  { font-size: 11px; color: #888; margin-top: 1px; }
  .bill-amt  { font-weight: 700; font-size: 14px; color: #ff5b6b; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    background: #ff5b6b;
    color: white;
    margin-left: 6px;
  }
  .badge.soon { background: #ff9f43; }
  .badge.ok   { background: #22d47e; }

  .goal-row { margin-bottom: 10px; }
  .goal-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .progress { height: 7px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #5c7cff, #a78bfa); }

  .btn {
    display: block; width: 100%; padding: 9px;
    border: none; border-radius: 8px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    margin-bottom: 8px; text-align: center;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #5c7cff; color: white; }
  .btn-green   { background: #22d47e; color: white; }
  .btn-orange  { background: #ff9f43; color: white; }
  .btn-red     { background: #ff5b6b; color: white; }
  .btn-purple  { background: #a78bfa; color: white; }

  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
  .stat-row:last-child { border-bottom: none; }

  .spinner { text-align: center; padding: 30px; color: #888; }
  .alert { background: #fff3cd; border-left: 3px solid #ff9f43; padding: 10px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: white; padding: 8px 18px; border-radius: 20px;
    font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0;
    transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="header">
  <div class="brand">FINFLOW</div>
  <h1>📊 Dashboard</h1>
</div>

<div class="body" id="content">
  <div class="spinner">Loading your finances…</div>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, ms || 2500);
}

function fmt(n) { return '$' + parseFloat(n || 0).toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtK(n) { return n >= 1000 ? '$' + (n/1000).toFixed(1) + 'k' : fmt(n); }

function renderDashboard(d) {
  var s = d.surplus;
  var surplusColor = s >= 0 ? 'green' : 'red';
  var surplusPrefix = s >= 0 ? '+' : '';

  // Upcoming bills
  var billsHtml = '';
  if (d.upcoming && d.upcoming.length > 0) {
    d.upcoming.forEach(function(b) {
      var u = b.daysUntil;
      var badge = u === 0 ? '<span class="badge">TODAY</span>'
                : u === 1 ? '<span class="badge soon">TOMORROW</span>'
                : u <= 3  ? '<span class="badge soon">IN ' + u + 'D</span>'
                :            '<span class="badge ok">IN ' + u + 'D</span>';
      billsHtml += '<div class="bill-row">' +
        '<div><div class="bill-name">' + b.name + badge + '</div>' +
        '<div class="bill-due">Due day ' + b.dueDay + '</div></div>' +
        '<div class="bill-amt">' + fmt(b.minPayment) + '</div>' +
        '</div>';
    });
  } else {
    billsHtml = '<div style="color:#aaa;text-align:center;padding:10px;">🎉 No upcoming bills</div>';
  }

  // Goals
  var goalsHtml = '';
  if (d.goals && d.goals.length > 0) {
    d.goals.forEach(function(g) {
      var pct = g.target > 0 ? Math.min(100, g.current / g.target * 100) : 0;
      goalsHtml += '<div class="goal-row">' +
        '<div class="goal-header">' +
        '<span>' + (g.emoji||'🎯') + ' ' + g.name + '</span>' +
        '<span style="color:#5c7cff;font-weight:700;">' + pct.toFixed(0) + '%</span>' +
        '</div>' +
        '<div class="progress"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:10px;color:#888;margin-top:3px;">' +
        '<span>' + fmt(g.current) + ' saved</span><span>' + fmt(g.target) + ' goal</span></div>' +
        '</div>';
    });
  } else {
    goalsHtml = '<div style="color:#aaa;text-align:center;padding:8px;">No goals added yet</div>';
  }

  // Budget bar
  var total = d.income || 1;
  function bar(label, amt, color) {
    var p = Math.min(100, (amt / total * 100)).toFixed(1);
    return '<div style="margin-bottom:8px;">' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">' +
      '<span>' + label + '</span><span style="color:' + color + ';font-weight:700;">' + p + '%</span></div>' +
      '<div class="progress"><div style="height:100%;width:' + p + '%;background:' + color + ';border-radius:4px;"></div></div></div>';
  }

  var html =
    // KPIs
    '<div class="kpi-grid">' +
    '<div class="kpi green"><div class="label">Monthly Income</div><div class="value green">' + fmtK(d.income) + '</div></div>' +
    '<div class="kpi red"><div class="label">Expenses</div><div class="value red">' + fmtK(d.expenses) + '</div></div>' +
    '<div class="kpi ' + surplusColor + '"><div class="label">Net Surplus</div><div class="value ' + surplusColor + '">' + surplusPrefix + fmtK(s) + '</div></div>' +
    '<div class="kpi orange"><div class="label">Total Debt</div><div class="value orange">' + fmtK(d.debt) + '</div></div>' +
    '</div>' +

    // Financial details
    '<div class="section">' +
    '<h3>Cash Flow Details</h3>' +
    '<div class="stat-row"><span>Debt Payments</span><span style="color:#ff5b6b;font-weight:700;">' + fmt(d.debtPayments) + '/mo</span></div>' +
    '<div class="stat-row"><span>Monthly Interest Cost</span><span style="color:#ff9f43;font-weight:700;">' + fmt(d.interest) + '/mo</span></div>' +
    '<div class="stat-row"><span>Available After Obligations</span><span style="color:' + (s>=0?'#22d47e':'#ff5b6b') + ';font-weight:700;">' + fmt(s) + '</span></div>' +
    '</div>' +

    // Budget breakdown
    '<div class="section">' +
    '<h3>Budget Breakdown</h3>' +
    bar('Living Expenses', d.expenses, '#ff5b6b') +
    bar('Debt Payments', d.debtPayments, '#ff9f43') +
    bar('Surplus', Math.max(0, s), '#22d47e') +
    '</div>' +

    // Upcoming bills
    '<div class="section">' +
    '<h3>Upcoming Bills (Next 30 Days)</h3>' +
    billsHtml +
    '</div>' +

    // Goals
    '<div class="section">' +
    '<h3>Savings Goals</h3>' +
    goalsHtml +
    '</div>' +

    // Actions
    '<div class="section">' +
    '<h3>Quick Actions</h3>' +
    '<button class="btn btn-primary" onclick="sendReminders()">🔔 Send Bill Reminders</button>' +
    '<button class="btn btn-green"   onclick="sendMonthly()">📈 Send Monthly Report</button>' +
    '<button class="btn btn-orange"  onclick="checkAlerts()">⚠️ Check Budget Alerts</button>' +
    '<button class="btn btn-purple"  onclick="testNotif()">🧪 Test Notification</button>' +
    '</div>';

  document.getElementById('content').innerHTML = html;
}

function sendReminders() {
  toast('Sending reminders…');
  google.script.run.withSuccessHandler(function(){ toast('✅ Reminders sent!'); }).sendBillReminders();
}
function sendMonthly() {
  toast('Generating report…');
  google.script.run.withSuccessHandler(function(){ toast('✅ Monthly report sent!'); }).generateMonthlyReport();
}
function checkAlerts() {
  toast('Checking alerts…');
  google.script.run.withSuccessHandler(function(){ toast('✅ Alert check complete!'); }).checkBudgetAlerts();
}
function testNotif() {
  toast('Sending test…');
  google.script.run
    .withSuccessHandler(function(r){ toast(r.message || '✅ Test sent!'); })
    .testNotification();
}

// Load data
google.script.run
  .withSuccessHandler(function(data) { renderDashboard(data); })
  .withFailureHandler(function(e) {
    document.getElementById('content').innerHTML =
      '<div class="alert">❌ Error loading data: ' + e.message + '<br>Make sure you ran Setup Sheets first.</div>';
  })
  .getDataForSidebar();
</script>
</body>
</html>
